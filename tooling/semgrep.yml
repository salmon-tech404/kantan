# Kantanda — T1 Enforcement Layer using Semgrep
#
#   semgrep --config <path-to-kantanda>/tooling/semgrep.yml --error
#
# Contains only T1 rules: detectable via AST with near-zero false positive rate.
# Each rule includes a Kantanda rule ID at the start of the message for traceability.
#
# Parameters: replace $OWNERSHIP_KEY with your project's ownership column (userId / orgId / tenantId)
# as declared in profile.

rules:
  # ---------- BE-DB-001 · Anti-BOLA ----------
  - id: kantanda-query-missing-ownership-scope
    message: >-
      BE-DB-001: resource queries filtered by user ownership are missing the ownership filter
      (userId/orgId/tenantId). This is a BOLA vulnerability. Use findFirst with the ownership key
      instead of bare findUnique by id.
    languages: [typescript, javascript]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $P.$MODEL.findUnique({ where: { id: $ID } })
          - pattern: $P.$MODEL.update({ where: { id: $ID }, ... })
          - pattern: $P.$MODEL.delete({ where: { id: $ID } })
      - pattern-not-inside: |
          // kantanda-allow BE-DB-001: $REASON
          ...

  # ---------- BE-ERR-002 · Information Leakage ----------
  - id: kantanda-stacktrace-in-response
    message: >-
      BE-ERR-002: never include stack traces, SQL queries, or internal file paths
      in production API responses.
    languages: [typescript, javascript]
    severity: ERROR
    pattern-either:
      - pattern: $RES.json({..., stack: $E.stack, ...})
      - pattern: $RES.send($E.stack)
      - pattern: $RES.json({..., error: $E, ...})

  # ---------- SEC-JWT-001 · JWT Verification ----------
  - id: kantanda-jwt-verify-missing-claims
    message: >-
      SEC-JWT-001: jwt.verify must specify algorithms (rejecting 'none') and validate issuer
      and audience. Missing these parameters allows token forgery attacks.
    languages: [typescript, javascript]
    severity: ERROR
    patterns:
      - pattern: jwt.verify($T, $S)
      - pattern-not: jwt.verify($T, $S, {..., algorithms: [...], ...})

  - id: kantanda-jwt-decode-as-auth
    message: "SEC-JWT-001: jwt.decode does NOT verify signatures. Use jwt.verify for all authorization decisions."
    languages: [typescript, javascript]
    severity: ERROR
    pattern: jwt.decode(...)

  # ---------- SEC-SSRF-001 · SSRF Prevention ----------
  - id: kantanda-fetch-unvalidated-url
    message: >-
      SEC-SSRF-001: URLs from user input must be validated against an allowlist of hosts before use.
      Without allowlisting, attackers can read internal metadata services (SSRF).
    languages: [typescript, javascript]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: fetch($REQ.body.$X, ...)
          - pattern: fetch($REQ.query.$X, ...)
          - pattern: axios.get($REQ.body.$X, ...)
          - pattern: axios.$M($REQ.query.$X, ...)

  # ---------- SEC-UPL-001 · File Type Validation ----------
  - id: kantanda-upload-trusts-mimetype
    message: >-
      SEC-UPL-001: never trust client-supplied mimetype or file extension. Read magic bytes
      from the buffer to determine the actual file type.
    languages: [typescript, javascript]
    severity: ERROR
    pattern-either:
      - pattern: if ($F.mimetype === "...") { ... }
      - pattern: $F.originalname.endsWith("...")

  # ---------- SEC-LOG-001 · PII in Logs ----------
  - id: kantanda-logging-sensitive-field
    message: >-
      SEC-LOG-001: never log passwords, tokens, API keys, or PII. Configure redaction
      at the logger layer instead of relying on developers to remember filtering.
    languages: [typescript, javascript]
    severity: ERROR
    pattern-either:
      - pattern: $LOG.$LEVEL({..., password: $V, ...})
      - pattern: $LOG.$LEVEL({..., token: $V, ...})
      - pattern: $LOG.$LEVEL({..., accessToken: $V, ...})
      - pattern: $LOG.$LEVEL({..., apiKey: $V, ...})
      - pattern: console.log($REQ.body)

  # ---------- SEC-AI-002 · LLM Output Sanitization ----------
  - id: kantanda-llm-html-not-sanitized
    message: >-
      SEC-AI-002: content generated by LLMs or user input must be sanitized via DOMPurify
      before inserting into the DOM. Unsan itized dangerouslySetInnerHTML is XSS.
    languages: [typescript, javascript]
    severity: ERROR
    patterns:
      - pattern: <$EL dangerouslySetInnerHTML={{ __html: $C }} />
      - pattern-not: <$EL dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(...) }} />

  # ---------- SEC-AUTH-003 · Anti-BFLA ----------
  - id: kantanda-admin-route-missing-guard
    message: >-
      SEC-AUTH-003: admin routes must pass through role-checking middleware before reaching
      business logic. Missing this guard is a Broken Function-Level Access Control (BFLA) vulnerability.
    languages: [typescript, javascript]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: $R.$METHOD("=~/.*admin.*/", $HANDLER)
          - pattern: $R.$METHOD("=~/.*admin.*/", $H1, $HANDLER)
      - pattern-not: $R.$METHOD("...", ..., requireRole(...), ...)
      - pattern-not: $R.$METHOD("...", ..., authorize(...), ...)

  # ---------- BE-DB-002 · Transaction Safety ----------
  - id: kantanda-sequential-writes-without-transaction
    message: >-
      BE-DB-002: multiple sequential writes across different tables must be wrapped in
      a $transaction. Partial writes without transactions leave the database in an inconsistent state.
    languages: [typescript, javascript]
    severity: WARNING
    patterns:
      - pattern: |
          await $P.$M1.create(...)
          ...
          await $P.$M2.create(...)
      - pattern-not-inside: $P.$transaction(...)

  # ---------- FE-API-001 · Service Layer Pattern ----------
  - id: kantanda-fetch-inside-component
    message: "FE-API-001: wrap network calls in typed service functions; never call fetch/axios directly from components."
    languages: [typescript, javascript]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: useEffect(() => { ... fetch(...) ... }, ...)
          - pattern: useEffect(() => { ... axios.$M(...) ... }, ...)
